# BEGIN pseo-security-headers
# Managed by scripts/droplet-server-config.sh (source: this file).
# Spliced into /var/www/html/.htaccess ABOVE the other site's block; edit the
# source file, never the server copy.
#
# NOT applied by a deploy. This header used to claim it was spliced in "on
# every deploy" and it never was: scripts/deploy.sh uploads the two site
# folders and leaves the shared .htaccess alone, because that file is also the
# other site's. Believing otherwise is what let the live CSP go on allowing two
# origins from the old hosting platform for three weeks after this file stopped
# naming them. scripts/deploy.sh now compares the live block against this one
# and refuses to deploy when they differ, so editing this file and forgetting
# to run droplet-server-config.sh fails loudly instead of quietly.
#
# Why this exists: a static export has no Next.js server, so next.config.ts
# headers() never runs. Without this block both droplet copies shipped with
# ZERO security headers (found in the 2026-09-08 audit). This file is now the
# ONLY definition of those headers, and it is scoped to static file types so
# WordPress's own PHP responses are untouched. Requires mod_headers +
# mod_expires.

<IfModule mod_rewrite.c>
  RewriteEngine On
  # Hidden files under our two folders. Ubuntu's stock config denies only
  # `.ht*`, so any other dotfile that lands in a web root is served as plain
  # text — a stray .env, a .git directory, an editor swap file. The per-site
  # scripts/site.htaccess carries the same deny and is the one that matters,
  # because it ships with every deploy; this is the backstop for the case that
  # actually happens, an out/ rsynced by hand (DEPLOYMENT.md still documents
  # that flow) with no .htaccess in it at all.
  #
  # Scoped to /resources and /resources-pro. The shared root's own dotfiles are
  # the other site's business, and in particular /.well-known/ must keep
  # answering: ACME writes the certificate-renewal challenge there, and a
  # renewal that fails takes the site dark behind its own two-year HSTS. The
  # second condition exempts it under our folders too, for the same reason.
  #
  # Written as a rewrite because this file already runs a rewrite engine;
  # site.htaccess uses RedirectMatch because turning a rewrite engine on in a
  # per-directory .htaccess would drop the rules below for that whole tree.
  # 403 matches the URL shape, not the disk, so it is not a file-existence
  # oracle — the same way the stock `.ht*` rule already behaves.
  # This rule is first: a dotfile is refused, not redirected to https first.
  RewriteCond %{REQUEST_URI} ^/resources(-pro)?/
  RewriteCond %{REQUEST_URI} !(^|/)\.well-known/
  RewriteCond %{REQUEST_URI} (^|/)\.
  RewriteRule ^ - [F,L]
  # Plain http:// served the static copies with no redirect, so HSTS never
  # applied and the insecure-context tools (clipboard, Web Crypto) failed.
  # Redirect to the HTTPS host only for our paths; WordPress is left alone.
  # __HTTPS_HOST__ is substituted by droplet-server-config.sh when it applies
  # this block, and identically by deploy.sh when it compares the live block
  # against this file (a raw-IP https URL has no certificate, so the hostname
  # must be the one on the cert). Change one substitution and change both.
  RewriteCond %{HTTPS} off
  RewriteCond %{REQUEST_URI} ^/resources(-pro)?(/|$)
  RewriteRule ^ https://__HTTPS_HOST__%{REQUEST_URI} [R=301,L]
  # A static export cannot send a 307. The Pro shells for "/" and the
  # category indexes are blank RSC-redirect pages to a crawler or unfurler
  # (a browser hydrates and moves on). Redirect them for real.
  RewriteRule ^resources-pro/?$ /resources-pro/tools/ [R=302,L]
  RewriteRule ^resources-pro/(guides|checklists|comparisons|templates|calculators|glossary|site)/?$ /resources-pro/tools/ [R=302,L]
</IfModule>

# /resources/topics/ and /resources/authors/ have no index page; never list directories.
Options -Indexes
ErrorDocument 404 /resources/404.html

<IfModule mod_headers.c>
  <FilesMatch "\.(html|htm|xml|json|js|css|svg|woff2?|png|jpg|jpeg|gif|webp|ico|txt)$">
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"
    Header always set Permissions-Policy "accelerometer=(), ambient-light-sensor=(), autoplay=(), camera=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(self), sync-xhr=(), usb=(), interest-cohort=()"
    Header always set Cross-Origin-Opener-Policy "same-origin"
    # connect-src is 'self' alone. It used to also allow two vercel.app hosts,  # no-vercel-guard
    # which survived the 2026-09-18 removal because that guard only  # no-vercel-guard
    # walked .ts/.tsx/.mjs/.js/.sh/.json/.css and never opened a .conf — while
    # asserting next.config.ts said connect-src 'self', which reads like proof
    # that the live header was tight. It was not: a static export runs no
    # Next.js server, so next.config.ts headers() never execute and THIS file is
    # what the browser actually receives.
    #
    # Leaving them was not cosmetic. Once that account is closed those
    # subdomains are free for anyone to register, so the policy would
    # have gone on naming an attacker-claimable origin as a permitted fetch
    # destination — a ready-made exfiltration channel for any future injection.
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"
  </FilesMatch>

  # Tool pages: the Permission Checker calls navigator.permissions.query for
  # camera/microphone/geolocation/etc. A feature that Permissions-Policy
  # disallows queries as "denied", so the sitewide list above made the tool
  # report 7 of 11 permissions as BLOCKED for every visitor. `self` lets the
  # page ask; no tool activates a camera or sensor. Mirrors next.config.ts.
  <If "%{REQUEST_URI} =~ m#^/resources(-pro)?/tools/#">
    Header always set Permissions-Policy "accelerometer=(self), ambient-light-sensor=(), autoplay=(), camera=(self), encrypted-media=(), fullscreen=(self), geolocation=(self), gyroscope=(self), magnetometer=(self), microphone=(self), midi=(self), payment=(), picture-in-picture=(), publickey-credentials-get=(self), sync-xhr=(), usb=(), interest-cohort=()"
  </If>

  # The Pro copy is a product surface, never a search result.
  <If "%{REQUEST_URI} =~ m#^/resources-pro/#">
    Header always set X-Robots-Tag "noindex, follow"
  </If>

  # Ad-blocker bait files are ad-shaped on purpose; never index them.
  <If "%{REQUEST_URI} =~ m#^/resources(-pro)?/adtest/#">
    Header always set X-Robots-Tag "noindex, nofollow"
  </If>
</IfModule>

<IfModule mod_expires.c>
  ExpiresActive On
  # Hashed Next.js assets are immutable by construction.
  <If "%{REQUEST_URI} =~ m#^/resources(-pro)?/_next/static/#">
    ExpiresDefault "access plus 1 year"
    Header set Cache-Control "public, max-age=31536000, immutable"
  </If>
</IfModule>
# END pseo-security-headers
