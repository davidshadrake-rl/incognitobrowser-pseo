# BEGIN pseo-security-headers
# Managed by scripts/deploy-droplet.sh (source: scripts/droplet-htaccess.conf).
# Spliced into /var/www/html/.htaccess ABOVE the WordPress block on every
# deploy; edit the source file, never the server copy.
#
# Why this exists: a static export has no Next.js server, so next.config.ts
# headers() never runs. Without this block both droplet copies shipped with
# ZERO security headers (found in the 2026-09-08 audit). It mirrors the
# Vercel deploy's headers and is scoped to static file types so WordPress's
# own PHP responses are untouched. Requires mod_headers + mod_expires.

<IfModule mod_rewrite.c>
  RewriteEngine On
  # Plain http:// served the static copies with no redirect, so HSTS never
  # applied and the insecure-context tools (clipboard, Web Crypto) failed.
  # Redirect to the HTTPS host only for our paths; WordPress is left alone.
  # __HTTPS_HOST__ is substituted by deploy-droplet.sh (a raw-IP https URL
  # has no certificate, so the hostname must be the one on the cert).
  RewriteCond %{HTTPS} off
  RewriteCond %{REQUEST_URI} ^/resources(-pro)?(/|$)
  RewriteRule ^ https://__HTTPS_HOST__%{REQUEST_URI} [R=301,L]
  # A static export cannot send a 307. The Pro shells for "/" and the
  # category indexes are blank RSC-redirect pages to a crawler or unfurler
  # (a browser hydrates and moves on). Redirect them for real.
  RewriteRule ^resources-pro/?$ /resources-pro/tools/ [R=302,L]
  RewriteRule ^resources-pro/(guides|checklists|comparisons|templates|calculators|glossary|site)/?$ /resources-pro/tools/ [R=302,L]
</IfModule>

# /resources/topics/ and /resources/authors/ have no index page; never list directories.
Options -Indexes
ErrorDocument 404 /resources/404.html

<IfModule mod_headers.c>
  <FilesMatch "\.(html|htm|xml|json|js|css|svg|woff2?|png|jpg|jpeg|gif|webp|ico|txt)$">
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"
    Header always set Permissions-Policy "accelerometer=(), ambient-light-sensor=(), autoplay=(), camera=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(self), sync-xhr=(), usb=(), interest-cohort=()"
    Header always set Cross-Origin-Opener-Policy "same-origin"
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://incognitobrowser-pseo.vercel.app https://incognitobrowser-pro.vercel.app; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"
  </FilesMatch>

  # Tool pages: the Permission Checker calls navigator.permissions.query for
  # camera/microphone/geolocation/etc. A feature that Permissions-Policy
  # disallows queries as "denied", so the sitewide list above made the tool
  # report 7 of 11 permissions as BLOCKED for every visitor. `self` lets the
  # page ask; no tool activates a camera or sensor. Mirrors next.config.ts.
  <If "%{REQUEST_URI} =~ m#^/resources(-pro)?/tools/#">
    Header always set Permissions-Policy "accelerometer=(self), ambient-light-sensor=(), autoplay=(), camera=(self), encrypted-media=(), fullscreen=(self), geolocation=(self), gyroscope=(self), magnetometer=(self), microphone=(self), midi=(self), payment=(), picture-in-picture=(), publickey-credentials-get=(self), sync-xhr=(), usb=(), interest-cohort=()"
  </If>

  # The Pro copy is a product surface, never a search result (matches the
  # X-Robots-Tag the Vercel Pro deploy sends).
  <If "%{REQUEST_URI} =~ m#^/resources-pro/#">
    Header always set X-Robots-Tag "noindex, follow"
  </If>

  # Ad-blocker bait files are ad-shaped on purpose; never index them.
  <If "%{REQUEST_URI} =~ m#^/resources(-pro)?/adtest/#">
    Header always set X-Robots-Tag "noindex, nofollow"
  </If>
</IfModule>

<IfModule mod_expires.c>
  ExpiresActive On
  # Hashed Next.js assets are immutable by construction.
  <If "%{REQUEST_URI} =~ m#^/resources(-pro)?/_next/static/#">
    ExpiresDefault "access plus 1 year"
    Header set Cache-Control "public, max-age=31536000, immutable"
  </If>
</IfModule>
# END pseo-security-headers
